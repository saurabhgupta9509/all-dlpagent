[package]
name = "dlp-agent"
version = "1.0.0"
edition = "2021"

[dependencies]
# Async runtime
image = "0.25"
imageproc = "0.25"
screenshots = "0.8"
leptess = "0.14"
whatlang = "0.16"
unicode-segmentation = "1.10"
local_ipaddress = "0.1.3" 
mac_address = "1.1.3"    


infer = "0.13"



# HTTP client/server
reqwest = { version = "0.11.24", features = ["json", "stream"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "0.2"
bytes = "1.4"
tempfile = "3"

# TLS/SSL
rustls = "0.21"
tokio-rustls = "0.24"
rustls-pemfile = "1.0"
webpki-roots = "0.22"
webpki = "0.22"
# Certificate generation
rcgen = "0.11"
pem = "2.0"
hyper-rustls = "0.24"
# Logging
log = "0.4"
env_logger = "0.11"

# Async traits
async-trait = "0.1.64"

# System info
whoami = "1.4.1"

# Randomization
rand = "0.8"

# CLI interaction
dialoguer = "0.10"

# Utilities
once_cell = "1.21.3"
ctrlc = "3.5.1"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.5"
time = "0.3"
thiserror = "1.0"  # Better error handling
hyper = { version = "0.14", features = ["full"] }
# fsfilter = { version = "0.2.2" } 
uuid = { version = "1", features = ["v4"] } 

# STEP 1: Filesystem Index
parking_lot = "0.12.5"
walkdir = "2.5.0"

# STEP 2: Communication Layer
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "macros"] }
futures = "0.3"
tower = "0.4"

# Windows API - COMPREHENSIVE FOR ALL DLP FEATURES
windows-sys = { version = "0.52", features = [
    # Core Windows infrastructure
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_Security",
    
    # USB Protection features
    "Win32_Devices_Usb",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_Devices_Properties",
    
    # Network Protection (WFP) - Firewall
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Rpc",
    "Win32_Networking_WinSock",
    
    # Web Proxy - Certificate & Registry
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    
    # Process/System monitoring
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem"
] }
base64 = "0.22.1"
uiautomation = "0.13"
url = "2.5"

notify = "8.2.0"

    # warp = "0.4.2"
warp = "0.3"
regex = "1.12.2"
sysinfo = "0.37.2"
socket2 = "0.6.1"
network-interface = "2.0.5"
fallible = "0.1.3"
#sysinfo = { version = "0.37.2", features = ["disks", "cpu"] }


[dev-dependencies]
winres = "0.1"
slint-build = "1.6"

[build-dependencies]
winres = "0.1"

